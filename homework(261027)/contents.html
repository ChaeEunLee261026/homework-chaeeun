<!DOCTYPE html>
<html lang="en"> <!-- HTML은 웹페이지의 뼈대를 만드는 언어 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <!-- 제목 --> 
<h1>안녕하세요!</h1> <!-- <h1> : 제목을 나타내는 태그 -->
<h2>나를 소개합니다</h2>
<h3>나의 취미</h3>
<h4>좋아하는 음식</h4>
<h5>좋아하는 색깔</h5>
<h6>작은 제목</h6>
<!--  h1 ~ h6 : 제목 / 웹페이지의 제목이나 소제목을 나타내는 태그 / 숫자가 작을수록 제목이 크고 중요 -->

<!-- 문단 -->
<p>나는 학생입니다.</p> <!-- <p> : 문단을 나타내는 태그-->
<p>나는 학교에 다닙니다.</p>

<!-- 영역 구분 -->
<div> <!-- 여러 글자나 내용을 하나의 영역으로 묶을 때 사용하는 태그 -->
    <p>나는 <span>사과</span>를 좋아합니다.</p> <!-- <span> : 인라인 영역 / 문장 안에서 특정 글자나 부분만 따로 꾸미거나 구분할 때 사용-->
</div>

<!-- 링크 -->
<a href="https://www.naver.com">네이버 바로가기</a> <!-- <a> : 링크 / 다른 웹사이트나 페이지로 이동할 수 있는 링크를 만들 때 사용-->

<br><br> <!-- br은 줄바꿈을 위한 추가 태그 -->

<!-- 이미지 -->
<img src="apple.jpg" alt="사과 사진" width="100"> <!-- 웹페이지에 사진이나 그림을 보여줄 때 사용하는 태그 -->
<!-- src : 이미지 파일의 위치 -->
 <!-- alt : 이미지가 보이지 않을 때 대신 설명해 주는 글 -->

<!-- 순서가 없는 목록 --> <!-- 목록 관련 태그 / 목록은 여러 가지 내용을 보기 좋게 나열할 때 사용 -->
<h3>좋아하는 음식</h3>
<ul> <!-- ul : 순서가 없는 목록 / 순서가 중요하지 않은 목록을 만들 때 사용 -->
    <li>피자</li> <!-- li : 목록의 항목 / 목록 안에 들어가는 각각의 내용을 나타내는 태그 -->
    <li>치킨</li>
    <li>햄버거</li>
</ul>

<!-- 순서가 있는 목록 -->
<h3>하루 일과</h3>
<ol> <!-- ol : 순서가 있는 목록 / 순서가 중요한 목록을 만들 때 사용 -->
    <li>아침 먹기</li>
    <li>학교 가기</li>
    <li>숙제하기</li>
</ol>

<!-- 입력창과 버튼 -->
<h3>이름 입력하기</h3>
<form>
    <input type="text" placeholder="이름을 입력하세요"> <!-- input : 사용자 입력 / 사용자가 글자나 숫자 등을 입력할 수 있는 칸을 만들 때 사용 -->
    <!-- type="text" : 글자를 입력하는 칸 --> <!-- placeholder : 입력하기 전에 보여주는 안내 문구 -->
    <button type="submit">제출하기</button> <!-- button : 버튼 / 사용자가 클릭할 수 있는 버튼을 만들 때 사용 -->
</form> <!-- form : 입력 양식 / 사용자가 입력한 정보를 하나의 양식으로 묶을 때 사용 -->

<!-- 표 만들기 --> <!-- 표(Table) 관련 태그 / 표는 정보를 가로와 세로로 나누어 정리할 때 사용 -->
<h3>나의 정보</h3>
<table border="1"> <!-- table : 표 전체 / 표를 만들 때 가장 바깥쪽에 사용하는 태그 -->
  
    <tr> <!-- tr : 표의 행 / 표에서 가로 한 줄을 만드는 태그 -->
        <!-- th : 표의 제목 셀 / 표의 제목이나 항목 이름을 나타내는 태그 / 기본적으로 글자가 굵고 가운데 정렬 -->
        <td>철수</td> <!-- td : 표의 데이터 셀 / 표 안에 실제 내용을 넣는 태그 -->
        <td>10살</td>
    </tr> 
    <tr>
        <td>영희</td>
        <td>11살</td>
    </tr>
</table>
<!-- table = 표 전체 / tr = 가로 한 줄 / th = 제목 칸 / td = 내용 칸 -->

</body>
</html>
